name: ddi-mc3-le2

services:
  db:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: le2
      POSTGRES_USER: ddi
      # Bewusstes Demo-Passwort fuer diese isolierte lokale Uebungsdatenbank.
      POSTGRES_PASSWORD: ddi_lokal_demo
      PGCLIENTENCODING: UTF8
    volumes:
      - le2_data:/var/lib/postgresql
      - .:/work:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddi -d le2"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  le2_data:
